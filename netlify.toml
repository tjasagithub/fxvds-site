# Publish directory is set explicitly to `.next`.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# `npm run dev` serves on 9002, not Netlify's assumed 3000.
[dev]
  command = "npm run dev"
  targetPort = 9002
  framework = "#custom"
